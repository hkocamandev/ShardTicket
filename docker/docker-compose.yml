version: "3.9"

services:
  shard1:
    image: mongo:6.0
    container_name: shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--port", "27018", "--bind_ip_all"]
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:6.0
    container_name: shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--port", "27020", "--bind_ip_all"]
    volumes:
      - shard2_data:/data/db

  configsvr:
    image: mongo:6.0
    container_name: configsvr
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--port", "27019", "--bind_ip_all"]
    volumes:
      - configsvr_data:/data/db

  mongo:
    image: mongo:6.0
    container_name: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongos:
    image: mongo:6.0
    container_name: mongos
    depends_on:
      - shard1
      - shard2
      - configsvr
    command: >
      mongos --configdb cfg/configsvr:27019
             --bind_ip_all
             --port 27017
    ports:
      - "27021:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 12

  mongo-setup:
    image: mongo:6.0
    container_name: mongo-setup
    depends_on:
      - shard1
      - shard2
      - configsvr
      - mongos
      - mongo
    volumes:
      - ./mongo-init:/scripts
    entrypoint: ["bash", "/scripts/setup.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: shard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Cache + short-TTL lock store; no persistence needed (allkeys-lru evicts
    # stale cache; locks expire via EX in seconds anyway). For "Redis as
    # source of truth" later, switch to AOF.
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  backend:
    build: ../backend
    container_name: shard_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    command: /bin/sh -c "sleep 10 && npm run dev"
    # NOTE: backend writes USE_TRANSACTIONS to /app/.env at runtime via
    # POST /admin/mode, then process.exit(0) so this service auto-restarts
    # (restart: unless-stopped). We do NOT use env_file here — dotenv reads
    # the mounted /app/.env on every startup, making the file authoritative.
    environment:
      - K6_SCENARIO_DIR=/k6/scenarios
      - K6_RESULTS_DIR=/k6/results
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BUY_RATE_LIMIT=100000
      - ADMIN_RATE_LIMIT=10000
    volumes:
      - ../backend:/app
      - ../k6:/k6
    depends_on:
      mongos:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:18
    container_name: shard_frontend
    restart: unless-stopped
    working_dir: /app
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_GRAFANA_URL=http://localhost:3001
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shard_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shard_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  shard1_data:
  shard2_data:
  configsvr_data:
  prometheus_data:
  grafana_data:
  frontend_node_modules:
