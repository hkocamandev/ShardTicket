version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /tools/screenshots
    schedule:
      interval: weekly
    # Version-update PRs for direct dependencies, minor and patch releases
    # only. Major upgrades need code changes and are done deliberately;
    # transitive packages move with their parents. Security updates are not
    # affected by this rule and still arrive for any version or dependency.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Version-update PRs for direct dependencies, minor and patch releases
    # only. Major upgrades need code changes and are done deliberately;
    # transitive packages move with their parents. Security updates are not
    # affected by this rule and still arrive for any version or dependency.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    # Version-update PRs for direct dependencies, minor and patch releases
    # only. Major upgrades need code changes and are done deliberately;
    # transitive packages move with their parents. Security updates are not
    # affected by this rule and still arrive for any version or dependency.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
