global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shardticket-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          app: shardticket
          component: backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: shardticket
          component: redis
